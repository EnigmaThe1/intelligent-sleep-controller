name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # Stable image with Python 3.10 support; avoid runner image churn.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure policy and read-only CLI tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (read-only, no suspend)
        run: PYTHONPATH=src python -m isc status
