name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # Use distro-provided Python; avoid network-dependent interpreter downloads.
    # Ubuntu 22.04 ships Python 3.10; Ubuntu 24.04 ships Python 3.12.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            python-version: "3.10"
          - runner: ubuntu-24.04
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Python version
        run: |
          /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.')))"
      - name: Pure policy and read-only CLI tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: CLI smoke test (read-only, no suspend)
        run: PYTHONPATH=src /usr/bin/python3 -m isc status
